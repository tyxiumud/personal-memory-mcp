# Render this template with scripts/render_client_configs.py, then merge the insert entry.
- insert:
    - id: personal-memory-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: personal_memory
        transport: stdio
        command: '__PERSONAL_MEMORY_PYTHON__'
        args: ['-m', 'personal_memory', 'serve']
        env:
          PERSONAL_MEMORY_DB: '__PERSONAL_MEMORY_DATABASE__'
          PYTHONUTF8: '1'
        cwd: '__PERSONAL_MEMORY_PROJECT_ROOT__'
        toolCallTimeoutMs: 30000
        failOnStartupError: true
